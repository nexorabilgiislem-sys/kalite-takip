<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Kalite Kontrol</title>
    <!-- Kesin Çözüm İçin Canlı Tarayıcı Kütüphanesi -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e293b; color: white; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #334155; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 15px; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 5px; border: 2px solid #64748b; background: #1e293b; color: white; font-size: 16px; box-sizing: border-box; }
        
        /* Durum Renkleri */
        .input-gecerli { border-color: #4ade80 !important; background: #064e3b !important; }
        .input-gecersiz { border-color: #f87171 !important; background: #7f1d1d !important; }

        #reader { width: 100%; margin-top: 10px; border-radius: 8px; overflow: hidden; background: #0f172a; }

        button#kaydetBtn { width: 100%; background: #4ade80; color: black; border: none; padding: 14px; margin-top: 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button#kaydetBtn:hover:not(:disabled) { background: #22c55e; }
        button#kaydetBtn:disabled { background: #64748b; color: #cbd5e1; cursor: not-allowed; opacity: 0.6; }

        .success { color: #4ade80; text-align: center; margin-top: 10px; font-weight: bold; }
        .error { color: #f87171; text-align: center; margin-top: 5px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>NEXORA KALİTE KONTROL</h2>
    
    <label>Personel Adı:</label>
    <input type="text" id="personel" placeholder="Adınızı girin...">
    
    <label>📷 Canlı Kamera QR Okuyucu:</label>
    <div id="reader"></div>
    
    <label>Okunan / Girilen Kod:</label>
    <input type="text" id="qrKod" placeholder="Kameradan otomatik dolacak..." oninput="kodDogrula(this.value)">
    
    <div id="hataMesaji" class="error"></div>

    <label>Ürün Modeli:</label>
    <input type="text" id="model" placeholder="Otomatik dolacak..." readonly style="background: #0f172a; color: #38bdf8;">
    
    <label>Seri Numarası:</label>
    <input type="text" id="seriNo" placeholder="Otomatik dolacak..." readonly style="background: #0f172a; color: #38bdf8;">
    
    <button id="kaydetBtn" onclick="kaydet()" disabled>ÖNCE GEÇERLİ BİR KOD OKUTUN</button>
    <div id="mesaj" class="success"></div>
</div>

<script>
    // Fabrikanın onaylı yerel veritabanı
    const veritabani = {
        "KM-240-GOVDE": { model: "KM-240 Baza Gövde", seri: "00491827" },
        "KM-180-PANEL": { model: "KM-180 Ön Panel", seri: "00491811" },
        "KM-300-MEK": { model: "KM-300 Otomatik Mekanizma", seri: "00491950" }
    };

    // Kod Doğrulama ve Filtreleme Mekanizması
    function kodDogrula(deger) {
        const temizKod = deger.trim().toUpperCase();
        const qrInput = document.getElementById('qrKod');
        const modelInput = document.getElementById('model');
        const seriInput = document.getElementById('seriNo');
        const kaydetBtn = document.getElementById('kaydetBtn');
        const hataDiv = document.getElementById('hataMesaji');

        if (temizKod === "") {
            qrInput.className = "";
            modelInput.value = "";
            seriInput.value = "";
            hataDiv.innerText = "";
            kaydetBtn.disabled = true;
            kaydetBtn.innerText = "ÖNCE GEÇERLİ BİR KOD OKUTUN";
            return;
        }

        if (veritabani[temizKod]) {
            // 🟢 GEÇERLİ KOD
            qrInput.className = "input-gecerli";
            modelInput.value = veritabani[temizKod].model;
            seriInput.value = veritabani[temizKod].seri;
            hataDiv.innerText = "";
            
            kaydetBtn.disabled = false;
            kaydetBtn.innerText = "ONAYLA VE KAYDET";
        } else {
            // 🔴 GEÇERSİZ KOD (Reddedilir)
            qrInput.className = "input-gecersiz";
            modelInput.value = "GEÇERSİZ ÜRÜN!";
            seriInput.value = "HATA";
            hataDiv.innerText = "⚠️ Bu kod veritabanında yok! Geçersiz ürün, kaydedilemez.";
            
            kaydetBtn.disabled = true;
            kaydetBtn.innerText = "GEÇERSİZ KOD - KİLİTLİ";
        }
    }

    // Kamera QR okuduğunda çalışacak ana fonksiyon
    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('qrKod').value = decodedText;
        kodDogrula(decodedText);
    }

    // Kamerayı başlatıyoruz
    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
            fps: 20, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        }, 
        false
    );
    html5QrcodeScanner.render(onScanSuccess);

    function kaydet() {
        const p = document.getElementById('personel').value;
        const q = document.getElementById('qrKod').value;
        const m = document.getElementById('model').value;
        const s = document.getElementById('seriNo').value;

        if(!p || !q) {
            alert("Lütfen personel adını girdiğinizden emin olun!");
            return;
        }

        const kayitlar = JSON.parse(localStorage.getItem('kaliteKayitlari') || '[]');
        kayitlar.push({ personel: p, qr: q, model: m, seri: s, tarih: new Date().toLocaleString() });
        localStorage.setItem('kaliteKayitlari', JSON.stringify(kayitlar));

        document.getElementById('mesaj').innerText = "Kayıt başarıyla sisteme işlendi!";
        setTimeout(() => { document.getElementById('mesaj').innerText = ""; }, 3000);

        // Formu sıfırla
        document.getElementById('qrKod').value = "";
        document.getElementById('model').value = "";
        document.getElementById('seriNo').value = "";
        document.getElementById('qrKod').className = "";
        document.getElementById('kaydetBtn').disabled = true;
        document.getElementById('kaydetBtn').innerText = "ÖNCE GEÇERLİ BİR KOD OKUTUN";
    }
</script>

</body>
</html>
